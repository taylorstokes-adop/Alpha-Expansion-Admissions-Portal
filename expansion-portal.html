<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Expansion Admissions — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --navy:#110068; --medium:#0D4AD1; --light:#418BE9; --sky:#00BCFF;
  --pale:#C8DBF4; --stat:#47C4E6; --white:#fff; --ink:#1a1636;
  --bg:#eef2f8; --card:#fff; --line:#e2e7f3; --muted:#5c6480; --soft:#f6f8fd; --green:#12B886;
  --grad-primary:linear-gradient(160deg,#110068 0%,#0D4AD1 100%);
  --grad-bright:linear-gradient(160deg,#0D4AD1 0%,#00BCFF 100%);
  --font:'Montserrat','Avenir Next','Avenir',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --c-mpls:#0D4AD1; --c-van:#00BCFF; --c-tor:#6C4BF0; --c-det:#E8590C; --c-cns:#12B886; --c-sea:#E64980;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
button{font-family:inherit;}

/* ---------- Top bar ---------- */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:11px 20px;position:sticky;top:0;z-index:40;}
.topbar .logo{height:24px;width:auto;display:block;cursor:pointer;}
.divider{width:1px;height:24px;background:rgba(255,255,255,.25);}
.product{font-weight:700;font-size:14px;letter-spacing:.2px;cursor:pointer;}
.product .tag{display:block;font-weight:600;font-size:9.5px;letter-spacing:1.4px;color:var(--sky);text-transform:uppercase;margin-top:1px;}
.spacer{flex:1;}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:9px;padding:8px 12px;min-width:210px;color:#c7d0ee;font-size:13px;}
.search svg{width:15px;height:15px;stroke:#c7d0ee;fill:none;stroke-width:2;}
.search input{border:none;background:transparent;color:#fff;font-family:inherit;font-size:13px;outline:none;width:100%;}
.search input::placeholder{color:#aab6e0;}
.scope{display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;font-size:12.5px;font-weight:600;}
.scope button{border:none;background:transparent;color:#c7d0ee;padding:8px 12px;cursor:pointer;font-weight:600;font-size:12.5px;}
.scope button.active{background:#fff;color:var(--navy);}
.toggle{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;}
.toggle button{border:none;background:transparent;color:#cdd6f5;padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;}
.toggle button.active{background:#fff;color:var(--navy);}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--grad-bright);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12.5px;border:none;cursor:pointer;flex:0 0 auto;}
.avatar.sm{width:30px;height:30px;font-size:11.5px;}
.avatar.lg{width:52px;height:52px;font-size:18px;}
.acct-id{display:flex;gap:14px;align-items:center;margin-bottom:6px;}
.acct-id .ai-n{font-weight:900;font-size:17px;color:var(--navy);}
.acct-id .ai-e{font-size:13px;color:var(--medium);}
.acct-id .ai-r{font-size:12.5px;color:var(--muted);margin-top:2px;}
.acct-sec{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin:20px 0 4px;padding-top:16px;border-top:1px solid var(--line);}
.acct-note{font-size:12.8px;color:var(--muted);line-height:1.55;margin:0 0 10px;}
.acct-input{width:100%;font-family:inherit;font-size:14px;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;}
.acct-input:focus{outline:none;border-color:var(--medium);box-shadow:0 0 0 3px rgba(13,74,209,.13);}
.acct-camps{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:300px;overflow-y:auto;padding:2px;}
@media(max-width:560px){.acct-camps{grid-template-columns:1fr;}}
.acct-camp{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:13.5px;}
.acct-camp.on{border-color:var(--medium);background:#eef4ff;}
.acct-camp input{margin:0;flex:0 0 auto;}
.acct-camp .ac-name{font-weight:700;color:var(--navy);flex:1;}
.acct-camp .ac-owner{font-size:11px;color:var(--muted);font-weight:700;}
.acct-camp.on .ac-owner{color:var(--medium);}
.tlpanel{display:flex;flex-direction:column;gap:10px;}
.tl-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 15px;}
.tl-who{display:flex;align-items:center;gap:11px;flex:0 0 240px;}
.tl-who .tl-n{font-weight:800;color:var(--navy);font-size:14px;}
.tl-who .tl-c{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tl-you{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#e4f8ef;color:#0b8a5b;padding:2px 7px;border-radius:999px;margin-left:4px;}
.tl-input{flex:1;font-family:inherit;font-size:13px;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;}
.tl-input:disabled{background:#f6f8fc;color:var(--muted);}

/* ---------- Breadcrumb ---------- */
.crumb{max-width:1180px;margin:0 auto;padding:14px 24px 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;}
.crumb a{color:var(--medium);cursor:pointer;font-weight:600;text-decoration:none;}
.crumb .sep{color:#b9c1d8;}

/* ---------- Layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:16px 24px 60px;}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:6px 0 20px;flex-wrap:wrap;}
.page-h h1{margin:0;font-weight:900;font-size:25px;letter-spacing:-.3px;color:var(--navy);text-transform:uppercase;}
.page-h .sub{color:var(--muted);font-size:13.5px;margin-top:3px;}
.section-title{font-weight:800;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--navy);margin:26px 0 13px;display:flex;align-items:center;gap:9px;}
.section-title .bar{width:20px;height:3px;background:var(--sky);border-radius:3px;}
.section-title .hint{font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px;}
/* campus color picker */
.cc-name .cdot{cursor:pointer;}
.cc-name{position:relative;}
.colorpop{position:absolute;top:24px;left:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(17,0,104,.2);padding:9px;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:186px;}
.swatch{width:20px;height:20px;border-radius:6px;cursor:pointer;box-shadow:0 0 0 1px var(--line);transition:transform .1s;}
.swatch:hover{transform:scale(1.15);}
/* ---- Parent view (lives inside the prototype, behind the top toggle) ---- */
body.parentmode .scope,body.parentmode .search{display:none;}
.pbar{background:#fff;border:1px dashed #c4cde6;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.pbar .pl{font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
.pbar select{flex:1;max-width:420px;padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;color:var(--ink);}
.pt-welcome h1{font-weight:900;font-size:26px;letter-spacing:-.3px;color:var(--navy);margin:2px 0 6px;}
.pt-welcome p{color:var(--muted);font-size:14.5px;margin:0 0 20px;max-width:620px;}
.pt-next{background:var(--grad-primary);color:#fff;border-radius:20px;padding:24px;position:relative;overflow:hidden;margin-bottom:10px;}
.pt-next .facets{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none;}
.pt-next .inner{position:relative;}
.pt-next .kick{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--sky);}
.pt-next h2{margin:8px 0 6px;font-size:22px;font-weight:800;line-height:1.2;}
.pt-next .when{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:700;margin-bottom:12px;}
.pt-next p{color:#dbe4fb;font-size:14.5px;margin:0 0 16px;max-width:560px;}
.pt-btnrow{display:flex;gap:10px;flex-wrap:wrap;}
.pt-btn{border:none;border-radius:11px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;}
.pt-btn.primary{background:#fff;color:var(--navy);} .pt-btn.primary:hover{background:#eaf1ff;}
.pt-btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);} .pt-btn.ghost:hover{background:rgba(255,255,255,.24);}
.pt-wrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.pt-msgbtn{background:#eef3ff;color:var(--medium);border:1px solid #d3e0fb;font-size:13px;padding:9px 15px;border-radius:10px;} .pt-msgbtn:hover{background:#e0e9ff;}
.pt-btn.pt-inactive{background:#eef1f6;color:#9aa3b2;border:1px dashed #cdd4e0;cursor:not-allowed;} .pt-btn.pt-inactive:hover{background:#e7ebf2;}
a.pt-btn{display:inline-block;text-decoration:none;}
.app-ov{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;}
.app-ov.open{display:flex;}
.app-ovbar{flex:0 0 auto;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;}
.app-ovbar .t{font-weight:800;font-size:14px;}
.app-ovbar .t em{font-style:normal;font-weight:600;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--sky);margin-left:8px;}
.app-ovx{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;}
.app-ovx:hover{background:rgba(255,255,255,.2);}
.app-ovframe{flex:1;width:100%;border:none;background:#eef2f8;}
/* Family Profile (reuses .awroot shell) */
.awroot .aw-steps{max-width:820px;margin:0 auto;padding:16px 22px 0;}
.awroot .pf-prog{height:7px;background:#dfe5f3;border-radius:6px;overflow:hidden;}
.awroot .pf-prog span{display:block;height:100%;background:var(--grad-bright);transition:width .25s;}
.awroot .pf-stepn{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:7px;}
.awroot .pf-note{background:#eef4ff;border:1px solid #d3e0fb;border-radius:12px;padding:13px 15px;font-size:13.5px;color:#33406a;line-height:1.55;}
.awroot .pf-field{margin:16px 0 0;}
.awroot .pf-field:first-child{margin-top:0;}
.awroot .pf-field label{display:block;font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:9px;line-height:1.4;}
.awroot .pf-rq{color:#d23f6f;margin-left:2px;}
.awroot .pf-opt{font-weight:600;color:var(--muted);font-size:12.5px;}
.awroot .pf-input{width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;}
.awroot .pf-input:focus{outline:none;border-color:var(--medium);box-shadow:0 0 0 3px rgba(13,74,209,.13);}
.awroot textarea.pf-input{min-height:90px;resize:vertical;}
.awroot textarea.pf-grow{min-height:46px;overflow:hidden;resize:none;line-height:1.5;}
.awroot .pf-choices{display:flex;flex-direction:column;gap:9px;}
.awroot .pf-bool{flex-direction:row;}
.awroot .pf-bool .pf-choice{flex:1;text-align:center;}
.awroot .pf-choice{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:12px 15px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
.awroot .pf-choice:hover{border-color:var(--medium);}
.awroot .pf-choice.on{border-color:var(--medium);background:#eef4ff;color:var(--medium);box-shadow:0 0 0 3px rgba(13,74,209,.1);}
.awroot .pf-scale{display:flex;gap:9px;}
@media(max-width:620px){.awroot .pf-scale{flex-direction:column;}}
.awroot .pf-scaleopt{flex:1;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:12px 11px;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.35;}
.awroot .pf-scaleopt:hover{border-color:var(--medium);}
.awroot .pf-scaleopt.on{color:#fff;border-color:transparent;background:var(--medium);}
.awroot .pf-chips{display:flex;flex-wrap:wrap;gap:9px;}
.awroot .pf-chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;}
.awroot .pf-chip:hover{border-color:var(--medium);}
.awroot .pf-chip.on{border-color:var(--medium);background:var(--medium);color:#fff;}
.awroot .pf-field.pf-err label{color:#d23f6f;}
.awroot .pf-field.pf-err .pf-choice,.awroot .pf-field.pf-err .pf-scaleopt,.awroot .pf-field.pf-err .pf-chip,.awroot .pf-field.pf-err .pf-input{border-color:#e0537f;}
.awroot .pf-errline{color:#d23f6f;font-size:13px;font-weight:700;margin-top:14px;}
.awroot .pf-scenario{background:var(--grad-primary);color:#fff;border-radius:16px;padding:20px 22px;margin-bottom:18px;}
.awroot .pf-scenario .pf-sc-k{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--sky);}
.awroot .pf-read{font-size:13px;font-weight:700;color:var(--medium);margin-bottom:10px;}
.awroot .pf-yourturn{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);margin:16px 0 2px;}
.awroot .pf-scenario h2{margin:6px 0 8px;font-size:19px;font-weight:800;}
.awroot .pf-scenario p{margin:0;color:#e4ebfb;font-size:14.5px;line-height:1.6;}
.awroot .pf-why{margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:11px;padding:11px 14px;font-size:13px;color:#eaf1ff;line-height:1.55;}
.awroot .pf-why b{color:#fff;}
.pt-backfam{background:none;border:none;color:var(--medium);font-weight:800;font-size:13px;cursor:pointer;padding:2px 0 8px;}
.pt-backfam:hover{text-decoration:underline;}
.pt-famtag{display:inline-block;margin-left:8px;font-size:10px;font-weight:800;letter-spacing:.3px;color:var(--medium);background:#eef4ff;border:1px solid #d3e0fb;border-radius:999px;padding:2px 8px;vertical-align:middle;}
.fam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:4px;}
.fam-card{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;font-family:inherit;transition:border-color .15s,box-shadow .15s,transform .1s;}
.fam-card:hover{border-color:var(--medium);box-shadow:0 6px 18px rgba(17,0,104,.09);}
.fam-card:active{transform:translateY(1px);}
.fam-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fam-name{font-weight:900;font-size:19px;color:var(--navy);}
.fam-pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.fam-meta{color:var(--muted);font-size:13px;margin-top:3px;}
.fam-next{font-size:13.5px;color:var(--ink);margin-top:12px;}
.fam-next .l{display:block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.fam-go{margin-top:12px;font-weight:800;font-size:13px;color:var(--medium);}
.fam-shared{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:620px){.fam-shared{grid-template-columns:1fr;}}
.fam-sh{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:18px;}
.fam-sh.current{border-color:var(--medium);background:#f7faff;}
.fam-sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.fam-sh-h .nm{font-weight:800;font-size:16px;color:var(--navy);}
.fam-sh p{color:var(--muted);font-size:13.5px;margin:0 0 14px;}
.scrlinkbar{display:flex;align-items:center;gap:10px;background:#f6f8fc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;flex-wrap:wrap;}
.scrlinkbar .pl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);white-space:nowrap;}
.scrlinkbar input{flex:1;min-width:260px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;color:var(--navy);}
.pt-prog-wrap{display:flex;align-items:center;gap:12px;margin:22px 2px 10px;}
.pt-prog-wrap .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--navy);white-space:nowrap;}
.pt-prog{flex:1;height:8px;background:#dfe5f3;border-radius:6px;overflow:hidden;}
.pt-prog span{display:block;height:100%;background:var(--grad-bright);}
.pt-prog-wrap .cnt{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
.pt-journey{position:relative;}
.pt-journey::before{content:"";position:absolute;left:19px;top:16px;bottom:30px;width:2px;background:var(--line);}
.pt-step{position:relative;display:flex;gap:16px;padding-bottom:12px;}
.pt-dot{flex:0 0 40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;z-index:1;border:3px solid var(--bg);}
.pt-dot.done{background:var(--green);color:#fff;}
.pt-dot.current{background:var(--grad-bright);color:#fff;box-shadow:0 0 0 4px rgba(0,188,255,.22);}
.pt-dot.upcoming{background:#fff;color:#b9c1d8;border:2px solid var(--line);}
.pt-card{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(17,0,104,.05);overflow:hidden;}
.pt-step.current .pt-card{border-color:var(--sky);box-shadow:0 6px 18px rgba(0,188,255,.16);}
.pt-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;cursor:pointer;}
.pt-head .t{flex:1;}
.pt-head .t .nm{font-weight:800;font-size:15.5px;color:var(--navy);}
.pt-head .t .wh{font-size:12.5px;color:var(--muted);margin-top:2px;}
.pt-sp{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px;border-radius:999px;white-space:nowrap;align-self:center;}
.pt-sp.done{background:#e4f8ef;color:#0b8a5b;} .pt-sp.current{background:#e4f6ff;color:#0e6a82;} .pt-sp.upcoming{background:#f0f1f6;color:#8188a3;}
.pt-chev{color:#b9c1d8;font-size:13px;align-self:center;transition:transform .18s;}
.pt-step.open .pt-chev{transform:rotate(180deg);}
.pt-body{display:none;padding:0 16px 16px;}
.pt-step.open .pt-body{display:block;}
.pt-body p{margin:0 0 12px;font-size:13.5px;color:#4a525a;line-height:1.55;}
.pt-body .pt-btn{padding:10px 16px;font-size:13px;}
.pt-body .pt-btn.primary{background:var(--medium);color:#fff;} .pt-body .pt-btn.primary:hover{background:#0a3bb0;}
.pt-body .pt-btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
.pt-team{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 2px 10px rgba(17,0,104,.05);display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.pt-team .av{width:52px;height:52px;border-radius:50%;background:var(--grad-bright);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;}
.pt-team .who{flex:1;min-width:200px;}
.pt-team .who .n{font-weight:800;color:var(--navy);font-size:15px;}
.pt-team .who .r{font-size:12.5px;color:var(--muted);}
.pt-team .who .c{font-size:12.5px;color:var(--ink);margin-top:4px;}
.pt-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;}
.pt-fact{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:0 2px 10px rgba(17,0,104,.05);}
.pt-fact .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}

.credrow .cl{color:#aab6e0;font-size:12.5px;}
.credrow .cv{color:#fff;font-weight:800;font-size:13.5px;font-family:'Courier New',monospace;}

/* Campus cards */
.campgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.campcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;text-align:left;
  box-shadow:0 2px 10px rgba(17,0,104,.05);transition:transform .14s ease,box-shadow .14s ease;border-top:4px solid var(--medium);width:100%;}
.campcard:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(17,0,104,.14);}
.campcard .cc-top{padding:15px 16px 12px;}
.campcard .cc-name{font-weight:800;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:8px;}
.campcard .cc-owner{font-size:12px;color:var(--muted);margin-top:3px;}
.campcard .cc-owner b{color:var(--ink);font-weight:600;}
.campcard .cc-stats{display:flex;gap:0;border-top:1px solid var(--line);}
.campcard .cc-stat{flex:1;padding:11px 10px;text-align:center;border-right:1px solid var(--line);}
.campcard .cc-stat:last-child{border-right:none;}
.campcard .cc-stat .n{font-weight:900;font-size:19px;color:var(--navy);line-height:1;}
.campcard .cc-stat .l{font-size:10px;color:var(--muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.campcard .cc-foot{padding:10px 16px;background:var(--soft);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;}
.campcard .cc-foot .go{color:var(--medium);font-weight:700;}
.mine-badge{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:#e4f8ef;color:#0b8a5b;padding:3px 8px;border-radius:999px;}
.cc-status{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:#eef1f6;color:#7a8398;padding:3px 8px;border-radius:999px;}
.cc-status.live{background:#eef4ff;color:var(--medium);}
.cc-status.open{background:#fff6ed;color:#b3600a;}

/* Tool cards */
.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.tool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:left;width:100%;
  box-shadow:0 2px 10px rgba(17,0,104,.05);transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;position:relative;}
.tool:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(17,0,104,.13);border-color:var(--light);}
.tool .ic{width:40px;height:40px;border-radius:11px;background:var(--pale);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.tool .ic svg{width:21px;height:21px;stroke:var(--medium);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tool h3{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--navy);}
.tool p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4;}

/* Buttons */
.btn{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;}
.btn:hover{border-color:var(--medium);background:var(--soft);}
.btn.primary{background:var(--medium);border-color:var(--medium);color:#fff;}
.btn.primary:hover{background:#0a3bb0;}
.btn.sm{padding:6px 11px;font-size:12px;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:4px 0 20px;flex-wrap:wrap;}
.tabs button{border:none;background:transparent;padding:11px 15px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tabs button.active{color:var(--navy);border-bottom-color:var(--sky);}
.tabs button .soon{font-size:9px;color:#a2a9c2;font-weight:700;margin-left:4px;text-transform:uppercase;letter-spacing:.4px;}

/* Panels & tables */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(17,0,104,.05);overflow:hidden;}
.panel-pad{padding:18px;}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--soft);}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
th.sortable:hover{color:var(--navy);}
th .sarrow{color:#c2c9db;font-size:10px;margin-left:2px;}
th.sortable.active{color:var(--navy);}
th.sortable.active .sarrow{color:var(--medium);}
.colwrap{position:relative;margin-left:auto;}
.colmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(17,0,104,.18);padding:10px;width:200px;max-height:320px;overflow:auto;}
.colmenu-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:2px 6px 8px;}
.colopt{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer;}
.colopt:hover{background:var(--soft);}
.colopt input[disabled]{opacity:.4;}
th.colh{cursor:grab;}
th.colh.sortable{cursor:pointer;}
th.colh.dragging{opacity:.4;background:#e7efff;}
th.colh .gripdot{color:#c2c9db;font-size:10px;margin-right:5px;letter-spacing:-2px;cursor:grab;}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--soft);}
tbody tr:last-child td{border-bottom:none;}
.stu-name{font-weight:700;color:var(--navy);}
.stu-sub{font-size:11.5px;color:var(--muted);}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.cdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.chip.active{border-color:var(--navy);color:var(--navy);background:#f3f6fe;}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 2px 10px rgba(17,0,104,.05);}
.stat .n{font-weight:900;font-size:27px;line-height:1;color:var(--navy);}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600;}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:8px;}
.frow{display:flex;align-items:center;gap:11px;}
.frow .lab{flex:0 0 150px;font-size:12.5px;color:var(--ink);font-weight:600;}
.fbar{flex:1;height:20px;background:#eef1fa;border-radius:6px;overflow:hidden;}
.fbar span{display:block;height:100%;background:var(--grad-bright);}
.frow .v{flex:0 0 24px;text-align:right;font-weight:800;font-size:13px;color:var(--navy);}

/* Calendar */
.calmonth{margin-bottom:22px;}
.calmonth h4{margin:0 0 10px;font-weight:800;font-size:14px;color:var(--navy);}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.caldow{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:2px;}
.calcell{min-height:64px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px;font-size:11px;}
.calcell.empty{background:transparent;border:none;}
.calcell .dnum{color:var(--muted);font-weight:600;font-size:11px;}
.calev{margin-top:4px;border-radius:6px;padding:4px 6px;color:#fff;font-size:10.5px;font-weight:700;line-height:1.2;cursor:pointer;}
.calev.facil{border:1.5px dashed rgba(255,255,255,.75);font-style:italic;}
/* Roadshow Calendar: page actions, collapsible grouped filters, request queue */
.ph-actions{display:flex;gap:8px;align-items:center;}
.calfilter{margin-bottom:14px;}
.calfilter-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filt-toggle{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--navy);cursor:pointer;}
.filt-toggle .ft-count{color:var(--muted);font-weight:700;margin-left:4px;}
.calfilter .cfg{margin-top:12px;}
.calfilter .cfg-h{font-size:11.5px;font-weight:800;color:var(--navy);margin-bottom:7px;display:flex;align-items:center;gap:7px;}
.calfilter .cfg-h span{color:var(--muted);font-weight:600;}
.rrq-panel{margin-bottom:16px;padding:16px 18px;}
.rrq-h h3{margin:0 0 3px;font-size:16px;color:var(--navy);}
.rrq-h .rrq-count{background:#eef4ff;color:var(--medium);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;margin-left:6px;}
.rrq-h p{margin:0 0 12px;font-size:13px;color:var(--muted);max-width:720px;}
.rrq-empty{font-size:13px;color:var(--muted);padding:8px 0;}
.rrq-card{border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px;background:#fff;}
.rrq-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.rrq-city{font-weight:800;color:var(--navy);font-size:15px;}
.rrq-nocamp{font-weight:700;font-size:11px;color:#8a4b1a;background:#fff7ed;border:1px solid #f0b37e;border-radius:999px;padding:1px 8px;margin-left:6px;}
.rrq-by{font-size:12.5px;color:var(--muted);margin-top:2px;}
.rrq-by a{color:var(--medium);}
.rrq-badge.pending{background:#fff7ed;color:#b4530f;border:1px solid #f0b37e;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:800;white-space:nowrap;}
.rrq-note{font-size:12.5px;color:var(--ink,#1b2440);font-style:italic;margin:9px 0 2px;}
.rrq-dates{margin-top:11px;}
.rrq-dates .rrq-l{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;}
.rrq-dbtns{display:flex;gap:8px;flex-wrap:wrap;}
.rrq-date{border:1.5px solid var(--medium);background:#fff;color:var(--medium);border-radius:10px;padding:8px 14px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;transition:background .15s,color .15s;}
.rrq-date:hover{background:var(--medium);color:#fff;}
.rrq-foot{margin-top:11px;}
.rrq-history{margin-top:10px;}
.rrq-history summary{font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;}
.rrq-done{display:flex;gap:12px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);}
.rrq-done .rrq-dcity{font-weight:800;color:var(--navy);min-width:130px;}
.rrq-done.scheduled .rrq-dstat{color:var(--green,#12B886);font-weight:700;}
.rrq-done.declined .rrq-dstat{color:#c0392b;font-weight:700;}
.rrq-done .rrq-dby{color:var(--muted);margin-left:auto;}
.rr-dh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 6px;}
.rr-dates{display:flex;gap:8px;flex-wrap:wrap;}
.rr-dates input{font-family:inherit;font-size:13.5px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--navy);}

/* Pipeline board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
.bcol{flex:0 0 210px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;}
.bcol h4{margin:0 0 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);font-weight:800;display:flex;justify-content:space-between;}
.bcol h4 .ct{color:var(--muted);}
.bcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer;border-left:4px solid var(--medium);}
.bcard:hover{box-shadow:0 6px 16px rgba(17,0,104,.12);}
.bcard .bn{font-weight:700;font-size:12.5px;color:var(--navy);}
.bcard .bs{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(17,0,104,.42);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:50;}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:94vw;background:#fff;box-shadow:-12px 0 40px rgba(17,0,104,.25);
  transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:51;display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.dhead{background:var(--grad-primary);color:#fff;padding:20px 22px;position:relative;}
.dhead .close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:19px;cursor:pointer;}
.dhead .close:hover{background:rgba(255,255,255,.4);}
.dhead .dk{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sky);}
.dhead h2{margin:5px 0 3px;font-size:22px;font-weight:800;}
.dhead .dmeta{font-size:12.5px;color:#d7e0fb;}
.dbody{padding:20px 22px;overflow:auto;flex:1;}
.dsec{margin-bottom:20px;}
.dsec h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:800;}
.regdiff{background:#fff8ef;border:1px solid #f4d5bd;border-radius:10px;padding:11px 13px;margin-top:10px;}
.regdiff .rd-h{font-weight:800;font-size:12px;color:#c65312;margin-bottom:8px;}
.regdiff .rd-row{padding:7px 0;border-bottom:1px solid #f0ddc8;font-size:13px;}
.regdiff .rd-row:last-of-type{border-bottom:none;}
.regdiff .rd-l{font-weight:700;color:var(--navy);margin-bottom:2px;}
.regdiff .rd-app{color:var(--muted);font-size:12.5px;}
.regdiff .rd-reg{color:#c65312;font-size:12.5px;}
.regdiff .rd-note{font-size:11.5px;color:var(--muted);margin-top:8px;font-style:italic;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}
.kv .v{color:var(--ink);font-weight:600;text-align:right;}
.parentcard{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;}
.parentcard .pn{font-weight:700;font-size:13.5px;color:var(--navy);}
.parentcard .pr{font-size:11.5px;color:var(--muted);margin-top:1px;}
.parentcard .pc{font-size:12px;color:var(--ink);margin-top:6px;}
.placeholder{background:var(--soft);border:1px dashed #c4cde6;border-radius:10px;padding:13px;font-size:12.5px;color:var(--muted);line-height:1.5;}
.placeholder b{color:var(--ink);}

/* Footer + toast */
.footer{background:var(--navy);color:#cdd6f5;text-align:center;padding:20px;font-size:12px;margin-top:20px;}
.footer .a{color:var(--sky);font-weight:700;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 19px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(17,0,104,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .k{color:var(--sky);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.ghost{color:var(--muted);border-color:var(--line);}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--medium);cursor:pointer;}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eef4ff;border:1px solid #cfe0ff;border-radius:12px;padding:11px 14px;margin-bottom:12px;flex-wrap:wrap;}
.selbar b{color:var(--navy);}
.selbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
.cmp{position:fixed;inset:0;background:rgba(17,0,104,.5);display:none;align-items:center;justify-content:center;z-index:70;padding:22px;}
.cmp.open{display:flex;}
.cmp-box{background:#fff;border-radius:18px;width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);}
.cmp-head{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
.cmp-head h2{margin:0;font-size:17px;font-weight:800;}
.cmp-head .sub{font-size:12px;color:#c7d0ee;margin-top:2px;}
.cmp-head .x{border:none;background:rgba(255,255,255,.2);color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;}
.cmp-body{padding:20px;overflow:auto;}
.cmp-foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;gap:10px;}
.cmp-field{margin-bottom:14px;}
.cmp-field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;}
.cmp-field select{width:100%;max-width:420px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;}
.previewwrap{display:grid;grid-template-columns:230px 1fr;gap:16px;}
.reclist{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:54vh;}
.recitem{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:#fff;padding:11px 12px;cursor:pointer;font-family:inherit;}
.recitem:hover{background:var(--soft);}
.recitem.active{background:#eef4ff;}
.recitem .rn{font-weight:700;font-size:13px;color:var(--navy);}
.recitem .re{font-size:11.5px;color:var(--muted);}
.email{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:54vh;overflow-y:auto;}
.email-meta{background:var(--soft);border-bottom:1px solid var(--line);padding:12px 16px;font-size:12.5px;color:var(--muted);}
.email-meta b{color:var(--ink);}
.email-body{padding:22px;font-size:14px;color:#33384a;line-height:1.6;}
.email-body p{margin:0 0 12px;}
.email-body .elogo{height:26px;margin-bottom:14px;}
.email-btn{display:inline-block;background:var(--medium);color:#fff;font-weight:700;padding:11px 18px;border-radius:9px;text-decoration:none;margin:6px 0;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;}
.pbanner{background:#eef4ff;border:1px solid #cfe0ff;border-radius:12px;padding:12px 14px;font-size:13px;color:#33384a;margin-bottom:14px;}
.plaud-banner{display:flex;gap:12px;align-items:flex-start;background:#fff6ed;border:1px solid #f5cfa0;border-radius:12px;padding:12px 15px;font-size:13px;color:#4a3e30;line-height:1.55;margin-bottom:16px;}
.plaud-banner .pl-ic{font-size:20px;flex:0 0 auto;line-height:1.2;}
.plaud-banner b{color:#b3600a;}
.pbanner b{color:var(--navy);}
.linkbtn{display:inline-flex;align-items:center;gap:7px;background:var(--medium);border:1.5px solid var(--medium);color:#fff;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;text-decoration:none;}
.linkbtn:hover{background:#0a3bb0;}
@media(max-width:680px){.previewwrap{grid-template-columns:1fr;}}
/* checklist + flags + guide */
.prog{height:7px;background:#eef1fa;border-radius:5px;overflow:hidden;margin:2px 0 12px;}
.prog span{display:block;height:100%;background:var(--grad-bright);}
.chklist{display:flex;flex-direction:column;gap:2px;}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.chk:last-child{border-bottom:none;}
.chk .cb{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;}
.chk.done .cb{background:var(--green);border-color:var(--green);}
.chk .cl{flex:1;color:var(--muted);}
.chk.done .cl{color:var(--ink);}
.chk .co{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 7px;border-radius:6px;}
.chk .co.fam{background:#eef4ff;color:var(--medium);}
.chk .co.team{background:#ecfaf3;color:#0b8a5b;}
.flags{display:flex;flex-direction:column;gap:8px;}
.flag{background:#fff6ef;border:1px solid #f6d9c2;border-left:4px solid #E8590C;border-radius:9px;padding:9px 11px;}
.flag .ft{display:block;font-weight:800;font-size:11px;color:#c65312;text-transform:uppercase;letter-spacing:.4px;}
.flag .fd{font-size:13px;color:#5a4433;}
.gsum{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;}
.gc-ratings{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);}
.gc-ratings b{color:var(--navy);}
.gcards{display:flex;flex-direction:column;gap:14px;}
.gcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(17,0,104,.05);}
.gc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.gc-name{font-weight:800;font-size:15px;color:var(--navy);}
.gc-notes{font-size:13px;color:#33384a;background:var(--soft);border-radius:9px;padding:10px 12px;margin:8px 0 12px;}
.gf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.gf-grid label,.gf-notes-l{display:block;font-size:12px;font-weight:700;color:var(--muted);}
.gf-grid select,.gf-notes-l textarea{width:100%;margin-top:5px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;color:var(--ink);}
.gf-notes-l{margin-bottom:12px;} .gf-notes-l textarea{min-height:70px;resize:vertical;}
.guidebar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(17,0,104,.05);}
.gb-title{font-size:14px;color:var(--ink);}
.gc-meta{font-size:12px;color:var(--muted);margin-bottom:8px;}
.gc-meta b{color:var(--ink);}
.gc-context{font-size:12.5px;color:#33384a;background:#eef4ff;border:1px solid #cfe0ff;border-radius:9px;padding:9px 11px;margin-bottom:12px;}
.gf-meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.gf-meta-grid label{display:block;font-size:11px;font-weight:700;color:var(--muted);}
.gf-meta-grid select,.gf-meta-grid input{width:100%;margin-top:4px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff;}
.notedot{background:#E8590C;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:4px;}
@media(max-width:640px){.gf-meta-grid{grid-template-columns:1fr 1fr;}}
/* roadshow session sub-nav */
.rs-subnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.rs-tab{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;}
.rs-tab span{font-size:11px;font-weight:600;color:#9aa2bd;margin-top:2px;}
.rs-tab.active{border-color:var(--medium);background:#eef4ff;color:var(--navy);}
.rs-tab.active span{color:var(--medium);}
.rs-tab.add{color:var(--medium);border-style:dashed;justify-content:center;align-items:center;}
/* compose validation + vertical recipients */
.cmp-note{color:#d23f6f;font-weight:700;font-size:13px;min-height:16px;margin-top:4px;}
.cmp-field select.err{border-color:#e0537f;box-shadow:0 0 0 3px rgba(224,83,127,.18);}
.rec-list{border:1px solid var(--line);border-radius:10px;max-height:190px;overflow:auto;}
.rec-line{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);}
.rec-line:last-child{border-bottom:none;}
.rl-n{font-weight:700;color:var(--navy);font-size:13px;}
.rl-s{color:var(--muted);font-size:12px;}
/* applications tab */
.appcards{display:flex;flex-direction:column;gap:10px;}
.appcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 6px rgba(17,0,104,.05);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;font-family:inherit;}
.appcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(17,0,104,.12);border-color:var(--light);}
.apc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.apc-name{font-weight:800;font-size:15px;color:var(--navy);}
.apc-right{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.flagpill{background:#fff3ec;color:#c65312;border:1px solid #f6d9c2;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px;}
.flagpill.none{background:#f2f4f9;color:#9aa2bd;border-color:var(--line);}
.apc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 7px;}
.mchip{display:inline-flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:600;}
.mchip b{color:var(--muted);font-weight:800;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;}
.mchip.s{background:#f0fbf5;border-color:#bfe8d2;color:#0b6b46;} .mchip.s b{color:#0b8a5b;}
.mchip.g{background:#fff7ef;border-color:#f6d9c2;color:#9a4d16;} .mchip.g b{color:#c65312;}
.apc-sum{font-size:12px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.aibadge{display:inline-block;background:var(--grad-bright);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:2px 7px;border-radius:6px;vertical-align:middle;margin-right:4px;}
.aisum{font-size:13.5px;color:#33384a;line-height:1.55;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:10px;}
.tprofile{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
.trow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;}
.trow.s{border-color:#bfe8d2;background:#f0fbf5;}
.trow.g{border-color:#f6d9c2;background:#fff7ef;}

function genMap(s){
  const base={"Pre-K":150,"K":160,"1st":172,"2nd":185,"3rd":196,"4th":205,"5th":212,"6th":218,"7th":223,"8th":227}[s.grade]||195;

  const pct=v=>Math.max(44,Math.min(97, 60+(v-base)*2+(s.idx%6)));
  return {reading, readingPct:Math.round(pct(reading)), math, mathPct:Math.round(pct(math))};
}
/* Parent-facing "learning snapshot": plain-English gaps by subject, NOT RIT scores or the full report. */
function genMapGaps(s){
  const ms=s.mapScores||{};
  const gi={"Pre-K":0,"K":1,"1st":2,"2nd":3,"3rd":4,"4th":5,"5th":6,"6th":7,"7th":8,"8th":9};
  const g=(gi[s.grade]!=null?gi[s.grade]:5);
  const band=p=> p>=75?"a little ahead of" : p>=55?"right around" : p>=42?"just below" : "a bit behind";
  const READ=[["letter sounds and blending sounds into words","building a bank of sight words","following a story read aloud"],
    ["decoding longer words","reading smoothly and at a steady pace","retelling a story in order"],
    ["reading multi-syllable words","reading stamina on longer passages","finding the main idea"],
    ["using context to figure out new vocabulary","summarizing a passage in their own words","making inferences"],
    ["reading for author's purpose","comparing ideas across two texts","backing up an answer with evidence"],
    ["analyzing theme and tone","interpreting figurative language","evaluating the strength of an argument"]];
  const MATH=[["counting and early number sense","adding and subtracting within 20","naming shapes and patterns"],
    ["place value","multi-digit addition and subtraction","telling time and counting money"],
    ["multiplication and division facts","fractions as parts of a whole","measurement and data"],
    ["multi-step word problems","equivalent fractions","area and perimeter"],
    ["operations with fractions and decimals","ratios and rates","plotting on the coordinate plane"],
    ["proportional reasoning","integers and writing expressions","solving for an unknown variable"]];
  const pick=b=>b[Math.min(b.length-1, Math.max(0, g-1))];
  return { reading:{band:band(ms.readingPct||55), gaps:pick(READ)}, math:{band:band(ms.mathPct||55), gaps:pick(MATH)} };
}

const state = {scope:"mine", view:"home", campus:null, tab:"overview", filterStage:"all", calCampus:"all", boardCampus:"all", selected:new Set(), calParentMode:false, compose:null, guideMode:false, guideRS:null, screenerSel:null, colorPickCampus:null, parentMode:false, parentStudent:null, deviceOS:"win", sortCol:"name", sortDir:"asc",
 cols:["name","grade","stage","parents","applied"], colPickOpen:false, activity:[], roadshowRequests:[], calFilterOpen:false};
const ACT_KEY="alphaActivity_v1";
const RR_KEY="alphaRoadshowReq_v2";
function saveRequests(){try{localStorage.setItem(RR_KEY,JSON.stringify(state.roadshowRequests));}catch(e){}}
function restoreRequests(){try{const a=JSON.parse(localStorage.getItem(RR_KEY)||"null");if(Array.isArray(a))state.roadshowRequests=a;}catch(e){}}
function saveActivity(){try{localStorage.setItem(ACT_KEY,JSON.stringify(state.activity));}catch(e){}}
function restoreActivity(){try{const a=JSON.parse(localStorage.getItem(ACT_KEY)||"null");if(Array.isArray(a))state.activity=a;}catch(e){}}
/* log a sent message so we can show correspondence history and warn on double-sends */
function logActivity(studentIdx,tplKey,tplName){const s=STUDENTS[studentIdx];if(!s)return;state.activity.push({campusId:s.campus,studentIdx,family:s.last,child:s.first+" "+s.last,tplKey,tplName,when:(new Date()).toISOString(),by:TEAM[ME]||"You"});saveActivity();}
function activityFor(studentIdx,tplKey){return state.activity.filter(a=>a.studentIdx===studentIdx&&(!tplKey||a.tplKey===tplKey));}
function lastSent(studentIdx,tplKey){const l=activityFor(studentIdx,tplKey);return l.length?l[l.length-1].when:null;}
function gradeNum(g){return g==="Pre-K"?0:g==="K"?0.5:(parseInt(g,10)||0);}
/* HubSpot-style column registry: label, optional sort key, and a cell renderer */
const COLUMNS={
  name:{label:"Student", render:s=>`<div class="stu-name">${s.first} ${s.last}</div>`, sort:s=>(s.first+" "+s.last).toLowerCase()},
  grade:{label:"Grade", render:s=>s.grade, sort:s=>gradeNum(s.grade)},
  stage:{label:"Stage", render:s=>{const m=stageMeta(s.stage);return `<span class="pill" style="background:${m.hex}22;color:${m.hex}">${m.short}</span>`;}, sort:s=>stageOrd(s.stage)},
  parents:{label:"Parents", render:s=>s.parents.map(p=>p.name).join("<br>")},
  applied:{label:"Applied", render:s=>fmt(s.applied), sort:s=>s.applied||""},
  campus:{label:"Campus", render:s=>`<span class="cdot" style="background:${campusById[s.campus].hex};margin-right:6px"></span>${campusById[s.campus].name}`, sort:s=>campusById[s.campus].name},
  level:{label:"Level", render:s=>s.level||"—", sort:s=>["WL","LL","L1","L2","MS"].indexOf(s.level)},
  shadowDate:{label:"Shadow date", render:s=>{const r=ROADSHOWS.find(x=>x.id===s.roadshowId);return r&&r.date?fmt(r.date):'<span class="stu-sub">—</span>';}, sort:s=>{const r=ROADSHOWS.find(x=>x.id===s.roadshowId);return r&&r.date?r.date:"";}},
  screenerCall:{label:"Screener call", render:s=>s.scheduledAt?fmtDT(s.scheduledAt):'<span class="stu-sub">—</span>', sort:s=>s.scheduledAt||""},
  guideRec:{label:"Guide rec", render:s=>s.guide&&s.guide.published?s.guide.rec:'<span class="stu-sub">—</span>'},
  fit:{label:"Family fit", render:s=>{const sc=s.screener;return sc&&sc.graded?`<span class="fitpill ${sc.fitOverride||sc.fit}">${sc.fitOverride||sc.fit}</span>`:'<span class="stu-sub">—</span>';}},
  school:{label:"Current school", render:s=>s.current_school, sort:s=>(s.current_school||"").toLowerCase()},
  flags:{label:"Flags", render:s=>s.flags.length?s.flags.map(f=>`<span class="flagpill">${f.t}</span>`).join(" "):'<span class="stu-sub">None</span>'},
  owner:{label:"Owner", render:s=>TEAM[campusById[s.campus].owner], sort:s=>TEAM[campusById[s.campus].owner]},
  strength:{label:"Tenet strength", render:s=>s.tenet?tShort(s.tenet.strengthKey):"—"},
  growth:{label:"Tenet growth", render:s=>s.tenet?tShort(s.tenet.growthKey):"—"},
  device:{label:"Device", render:s=>s.device||"—", sort:s=>s.device||""},
  age:{label:"Age", render:s=>s.age||"—", sort:s=>s.age||0}
};
const COL_ORDER=["name","grade","stage","parents","applied","campus","level","shadowDate","screenerCall","guideRec","fit","school","flags","owner","strength","growth","device","age"];
const COL_KEY="alphaCols_v1";
function persistCols(){try{localStorage.setItem(COL_KEY,JSON.stringify(state.cols));}catch(e){}}
const CC_KEY="alphaCampusColors_v1";
function saveCampusColors(){try{const o={};CAMPUSES.forEach(c=>o[c.id]={hex:c.hex,owner:c.owner});localStorage.setItem(CC_KEY,JSON.stringify(o));}catch(e){}}
function restoreCampusColors(){try{const o=JSON.parse(localStorage.getItem(CC_KEY)||"null");if(o)CAMPUSES.forEach(c=>{const v=o[c.id];if(!v)return;if(typeof v==="string"){c.hex=v;}else{if(v.hex)c.hex=v.hex;if(v.owner&&TEAM[v.owner])c.owner=v.owner;}});}catch(e){}}
function restoreCols(){try{const c=JSON.parse(localStorage.getItem(COL_KEY)||"null");if(Array.isArray(c)&&c.length&&c.includes("name"))state.cols=c;}catch(e){}}
function sortStudents(list){const dir=state.sortDir==="asc"?1:-1,def=COLUMNS[state.sortCol];
  if(!def||!def.sort) return list.slice();
  return list.slice().sort((a,b)=>{const ka=def.sort(a),kb=def.sort(b);return ka<kb?-dir:ka>kb?dir:0;});}
function sortTH(col,label){const active=state.sortCol===col;const arrow=active?(state.sortDir==="asc"?"▲":"▼"):"⇅";return `<th class="sortable${active?' active':''}" data-sort="${col}">${label} <span class="sarrow">${arrow}</span></th>`;}
function fmtDT(iso){const d=new Date(iso);const h=d.getHours(),ap=h>=12?'PM':'AM',hh=((h+11)%12)+1;return `${fmtD(d)} · ${hh}:${String(d.getMinutes()).padStart(2,'0')} ${ap}`;}

const $ = s => document.querySelector(s);
const scopedCampuses = () => state.scope==="mine" ? CAMPUSES.filter(c=>c.owner===ME) : CAMPUSES;
const scopedCampusIds = () => scopedCampuses().map(c=>c.id);
const studentsForCampus = id => STUDENTS.filter(s=>s.campus===id);
const nextRoadshow = id => ROADSHOWS.filter(r=>r.campus===id&&r.date).sort((a,b)=>a.date.localeCompare(b.date))[0];
function pad2(n){return String(n).padStart(2,'0');}
function fmtD(d){return `${pad2(d.getMonth()+1)}/${pad2(d.getDate())}/${String(d.getFullYear()).slice(-2)}`;}
function fmt(iso){return fmtD(new Date(iso+'T00:00'));}
function chkDate(s,k){const d=new Date(s.applied+'T00:00');d.setDate(d.getDate()+(k+1)*4);return fmtD(d);}
const activeStages = ["shadow_booked","approved","reshadow","screener_booked","offer_sent","offer_accepted"];

/* =====================================================================
   VIEWS
   ===================================================================== */
function render(){
  if(state.parentMode){
    if(state.parentStudent==null){const d=STUDENTS.find(x=>isMultiChild(x))||STUDENTS.find(x=>x.stage==="shadow_booked")||STUDENTS[0];state.parentStudent=d.idx;}
    const sel=STUDENTS[state.parentStudent];
    if(sel && isMultiChild(sel) && state.parentView!=='child') renderFamilyHub(sel); else renderParent();
    return;
  }
  if(state.guideMode){renderGuideMode();return;}
  document.body.classList.remove('guidemode'); document.body.classList.remove('parentmode');
  {const ve=$("#viewExp"),vp=$("#viewParent"); if(ve)ve.classList.add("active"); if(vp)vp.classList.remove("active");}
  if(state.view==="home") renderHome();
  else if(state.view==="campus") renderCampus();
  else if(state.view==="calendar") renderCalendar();
  else if(state.view==="pipeline") renderPipeline();
  else if(state.view==="reports") renderReports();
}
function crumb(parts){
  $("#crumb").innerHTML = parts.map((p,i)=>
    (i<parts.length-1
      ? `<a ${p.home?'data-home="1"':''} ${p.view?`data-goview="${p.view}"`:''}>${p.t}</a><span class="sep">/</span>`
      : `<span>${p.t}</span>`)).join("");
}

/* ---------- HOME (Command Center) ---------- */
function renderHome(){
  crumb([{t:"Command Center"}]);
  const statusRank={"Roadshow activated":0,"Open":1,"Pre-roadshow":2};
  const list = scopedCampuses().slice().sort((a,b)=>{
    const sa=studentsForCampus(a.id).length, sb=studentsForCampus(b.id).length;
    if((sb>0)!==(sa>0)) return (sb>0)-(sa>0);
    const ra=statusRank[a.status]!=null?statusRank[a.status]:3, rb=statusRank[b.status]!=null?statusRank[b.status]:3;
    if(ra!==rb) return ra-rb;
    return a.name.localeCompare(b.name);
  });
  const totalStudents = list.reduce((n,c)=>n+studentsForCampus(c.id).length,0);
  $("#app").innerHTML = `
   <div class="page-h">
     <div><h1>Command Center</h1>
       <div class="sub">${state.scope==="mine"
          ? `Your pipelines &middot; ${list.length} campuses &middot; ${totalStudents} students`
          : `All Expansion campuses &middot; ${list.length} campuses &middot; ${totalStudents} students`}</div></div>
   </div>
   <p class="section-title"><span class="bar"></span>${state.scope==="mine"?"Your campuses":"All campuses"}
      <span class="hint">Open a campus to work its pipeline</span></p>
   <div class="campgrid">${list.map(campusCardHTML).join("")}</div>
   <p class="section-title"><span class="bar"></span>Cross-campus tools</p>
   <div class="toolgrid">
     <button class="tool" data-tool="pipeline">
       <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M10 18h4"/></svg></div>
       <h3>Pipeline Board</h3><p>Every student by stage across ${state.scope==="mine"?"your":"all"} campuses. Links to the admissions board.</p></button>
     <button class="tool" data-tool="calendar">
       <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div>
       <h3>Roadshow Calendar</h3><p>All roadshows, color-coded by campus, with registration counts.</p></button>
     <button class="tool" data-tool="reports">
       <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6"/></svg></div>
       <h3>Reports</h3><p>Weekly enrollment and roadshow numbers for the sales meeting.</p></button>
   </div>
   ${state.scope==='all'?teamLinksPanelHTML():''}`;
}
function teamLinksPanelHTML(){
  return `<p class="section-title"><span class="bar"></span>Parent Tenet call links</p>
    <div class="tlpanel">${Object.keys(TEAM).map(k=>{const camps=CAMPUSES.filter(c=>c.owner===k).map(c=>'Alpha '+c.name).join(', ')||'No campuses assigned';const ini=TEAM[k].split(' ').map(w=>w[0]).join('').slice(0,2);
      return `<div class="tl-row"><div class="tl-who"><span class="avatar sm">${ini}</span><div><div class="tl-n">${TEAM[k]}${k===ME?' <span class="tl-you">You</span>':''}</div><div class="tl-c">${camps}</div></div></div>
        <input class="tl-input" type="text" data-deanlink="${k}" value="${TEAM_LINKS[k]||''}" ${k===ME?'':'disabled'} ${k===ME?'':'title="Only this teammate can edit their own link"'}></div>`;}).join('')}</div>`;

  const accepted=studs.filter(s=>s.stage==="offer_accepted").length;
  const nrs=nextRoadshow(c.id);
  const mine=c.owner===ME;

const STORE_KEY="alphaExp_v2";
function persist(){ try{ const g={},r={},sc={}; STUDENTS.forEach(s=>{ if(s.guide)g[s.idx]=s.guide; if(s.screener)sc[s.idx]=s.screener; r[s.idx]={grade:s.grade,level:s.level,age:s.age,device:s.device,guideAssigned:s.guideAssigned,shadowAccount:s.shadowAccount,stage:s.stage,roadshowId:s.roadshowId,profileComplete:s.profileComplete,mapDone:s.mapDone,declined:s.declined,noShow:s.noShow,appStarted:s.appStarted,regEdits:s.regEdits,shadowReg:s.shadowReg,profileData:s.profileData,offer:s.offer}; }); localStorage.setItem(STORE_KEY,JSON.stringify({g,r,sc})); }catch(e){} }
function restore(){ try{ const d=JSON.parse(localStorage.getItem(STORE_KEY)||'null'); if(!d)return;
  Object.keys(d.g||{}).forEach(k=>{ const st=STUDENTS[+k], sv=d.g[k]; if(!st)return;
    // Keep seed feedback CONTENT (it's authored prose); only restore the user's publish/share toggles.
    if(st.guide){ if(sv&&typeof sv.sharedToParent==='boolean') st.guide.sharedToParent=sv.sharedToParent; if(sv&&typeof sv.published==='boolean') st.guide.published=sv.published; }
    else { st.guide=sv; }
  });
  Object.keys(d.sc||{}).forEach(k=>{if(STUDENTS[+k])STUDENTS[+k].screener=d.sc[k];});
  Object.keys(d.r||{}).forEach(k=>{if(STUDENTS[+k])Object.assign(STUDENTS[+k],d.r[k]);}); }catch(e){} }

  const val=ids=>studs.filter(s=>ids.includes(s.stage)).length;

}

function computeScreener(s){
  const mode=s.idx%3;
  const ratings=mode===0?["Strong","Strong","Strong","Neutral","Neutral"]:mode===1?["Strong","Strong","Neutral","Neutral","Concern"]:["Strong","Neutral","Neutral","Concern","Concern"];
  const perTenet={}; s.tenet.rank.forEach((k,i)=>perTenet[k]=ratings[i]);
  const concerns=ratings.filter(r=>r==="Concern").length, neutrals=ratings.filter(r=>r==="Neutral").length;
  const fit = concerns>=2 ? "Red" : (concerns===1||neutrals>=3) ? "Yellow" : "Green";
  const flags=[]; if(s.flags.length) flags.push(...s.flags.map(f=>f.t+" (from application)"));
  if(mode===2) flags.push("Pushed on tuition and outcomes in the first few minutes");
  if(mode>=1) flags.push("Some rescue language around letting the child struggle");
  const gName=tName(s.tenet.growthKey), sName=tName(s.tenet.strengthKey);
  const rationale = fit==="Green" ? `Strong, specific answers across the tenets with no concern flags. Clear mutual fit.`
    : fit==="Yellow" ? `Aligned overall, with one area to watch: ${gName}. Coachable by the Dean of Parents with a clear, time-bound expectation.`
    : `Two tenets surfaced real concerns, including ${gName}. The misalignment is broad enough that coaching is unlikely to close it before enrollment.`;
  const conditions = fit==="Yellow" ? `30-day Dean of Parents check-in on ${gName.toLowerCase()} at home, with a specific routine agreed before enrollment.` : "";
  const handoff = fit!=="Red" ? `${s.first}'s family is strongest on ${sName}. Watch ${gName}. ${fit==="Yellow"?"Enter with the condition above.":"No conditions."}` : "";
  return {graded:true, fit, perTenet, flags, rationale, conditions, handoff};
}

function monthHTML(ym,label,scopeIds,parent,events){
  const [y,mo]=ym.split("-").map(Number);
  const first=new Date(y,mo-1,1), start=first.getDay(), days=new Date(y,mo,0).getDate();
  let cells="";
  for(let i=0;i<start;i++) cells+='<div class="calcell empty"></div>';
  for(let d=1;d<=days;d++){
    const iso=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=events.filter(r=>r.date===iso && (r.facilitate || scopeIds.includes(r.campus)) && (state.calCampus==="all"||r.campus===state.calCampus));
    cells+=`<div class="calcell"><div class="dnum">${d}</div>${evs.map(e=>{const c=campusById[e.campus];
      const nm=c?c.name:(e.city||'Roadshow'); const hex=e.facilitate?OPEN_HEX:(c?c.hex:'#8891ad');
      const act= parent ? `data-toast="Shadow Day registration"` : (e.facilitate?`data-rsinfo="${e.id}"`:`data-enter="${c?c.id:''}"`);
      return `<div class="calev${e.facilitate?' facil':''}" style="background:${hex}" ${act} title="${e.facilitate?'Facilitate-only · '+nm:nm}">${nm}${parent?' Shadow Day':''}</div>`;}).join("")}</div>`;
  }
  return `<div class="calmonth"><h4>${label}</h4>
    <div class="calgrid">${["S","M","T","W","T","F","S"].map(d=>`<div class="caldow">${d}</div>`).join("")}${cells}</div></div>`;
}

function submitRoadshowRequest(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const name=g("rr_name"), email=g("rr_email"), sel=g("rr_campus"), cityIn=g("rr_city");
  const dates=["rr_d0","rr_d1","rr_d2"].map(g).filter(Boolean);
  if(!name){toast('<span class="k">Add your name</span> so we know who to confirm with.');return;}
  if(!/.+@.+\..+/.test(email)){toast('<span class="k">Add a valid email</span> for the confirmation.');return;}
  let campusId=null, city="";
  if(sel&&sel!=='other'){ campusId=sel; city=(campusById[sel]||{}).name||sel; }
  else { city=cityIn; }
  if(!city){toast('<span class="k">Pick your campus</span> or type a city.');return;}
  if(dates.length<3){toast('<span class="k">Add three dates</span> so we can find one we can staff.');return;}
  state.roadshowRequests.push({id:'rr'+Date.now(), requesterName:name, email, campusId, city, dates, status:'pending', submittedAt:todayISO()});
  saveRequests();
  $("#gmodal").classList.remove("open");
  renderCalendar();
  toast('<span class="k">Request submitted</span> &mdash; your expansion team will confirm one of your dates.');
}

/* Build a student's parent-journey steps + current index.
   For multi-child families the two household steps (Parent Tenet call, Family Profile)
   reflect family-level status so they read consistently across siblings. */
function parentJourney(s){
  const ord=stageOrd(s.stage), rv=(f)=>typeof f==="function"?f(s):f;
  const mapStep=(st)=>({name:rv(st.name),when:rv(st.when),body:rv(st.body),action:st.action,_fam:!!st.fam,_homework:!!st.homework});
  let steps, currentIdx;
  if(s.stage==="reshadow"){
    const extra=[
      {name:"Schedule your second Shadow Day", when:"We'll send you dates", body:s.first+" is invited back for a second Shadow Day so our guides can spend a little more time together. Pick a date and we'll see you again soon.", action:{label:"See Shadow Day dates",kind:"schedule"}, cur:true},
      {name:"Attend the second Shadow Day", when:"Your scheduled date", body:s.first+" spends another day on campus, the same routine as before. Just bring a water bottle and a snack.", action:{label:"See prep & details",kind:"prep"}},
      {name:"Hear again from our guides", when:"Within a few days", body:"Your Dean of Parents will share how the second day went and your next step."}
    ];
    const shared=s.guide&&s.guide.published&&s.guide.sharedToParent;
    const hearBack={name:"Hear back from our guides", when:shared?"Shared with you below":"We'll share this with you shortly",
      body: shared
        ? `Your guides shared their reflections from ${s.first}'s first Shadow Day, and your Dean of Parents has invited ${s.first} back for a second day so our guides can spend a little more time together. Read their feedback and the focus areas below so you can help ${s.first} prepare at home before your next Saturday.`
        : `Your guides are compiling their reflections from ${s.first}'s first Shadow Day. We'll share them here, along with a few things to focus on at home, before your second Shadow Day.`,
      action: shared?{label:"See the guides' feedback",kind:"feedback"}:null, status:"done", _fam:false};
    steps=PARENT_STEPS.slice(0,4).map(st=>({...mapStep(st),status:"done"}))
      .concat([hearBack])
      .concat(extra.map(e=>({name:e.name,when:e.when,body:e.body,action:e.action,status:e.cur?"current":"upcoming",_fam:false})))
      .concat(PARENT_STEPS.slice(5).map(st=>({...mapStep(st),status:"upcoming"})));
    currentIdx=steps.findIndex(x=>x.status==="current");
  } else if(s.stage==='inquiry'){
    steps=PARENT_STEPS.map((st,i)=>({...mapStep(st),status:i===0?"done":i===1?"current":"upcoming"}));
    currentIdx=1;
  } else {
    currentIdx=PARENT_STEPS.findIndex(st=>ord<st.at);
    steps=PARENT_STEPS.map((st,i)=>({...mapStep(st),status:(currentIdx===-1||i<currentIdx)?"done":i===currentIdx?"current":"upcoming"}));
  }
  if(isMultiChild(s)){
    const fa=famApprovedFn(s), fsc=famScheduledAt(s), fhw=famHomeworkDone(s);
    steps.forEach(st=>{ if(!st._fam) return; st._shared=true;
      if(st._homework){ st.status=fhw?'done':fa?'current':'upcoming'; st.when=fhw?'Complete':fa?'Shared across your family — before your Parent Tenet call':'Opens after a guide approval'; st._locked=!fhw&&!fa; }
      else { /* Parent Tenet call */ st.status=fsc?'done':fhw?'current':'upcoming'; st.when=fsc?fmtDT(fsc):fhw?'Available now — shared across your family':'Unlocks once your family homework is complete'; st._locked=!fsc&&!fhw; }
    });
    let ci=steps.findIndex(x=>x.status==='current');
    if(ci<0) ci = steps.every(x=>x.status==='done') ? -1 : steps.findIndex(x=>x.status==='upcoming');
    currentIdx=ci;
  } else {
    // Single-child: lock family homework until guide approval, and the Parent Tenet call until homework is done.
    // (reshadow sits at the same ordinal as approved but is NOT a yes, so gate on an actual guide Yes.)
    const appr=(s.guide&&s.guide.published&&s.guide.rec==='Yes')||PASSED_GUIDE.includes(s.stage);
    const hw=homeworkDone(s);
    steps.forEach(st=>{
      if(st._homework){ st._locked=!appr&&!hw; }
      else if(st.action&&st.action.kind==='call'){ st._locked=!hw&&!s.scheduledAt; }
    });
  }

function shadowRegDrawerHTML(s){
  const sr=s.shadowReg, re=s.regEdits||{};
  const diffs=Object.keys(re).filter(k=>String(re[k])!==String(regBase(s,k)));
  if(!sr && !diffs.length) return '';
  let h='<div class="dsec"><h3>Shadow Day registration</h3>';
  if(sr){
    if(sr.allergies==='Yes') h+=`<div class="flag" style="margin-bottom:8px;border-left:3px solid #e8590c"><span class="ft" style="color:#c65312">&#9888; Allergies / medications</span><span class="fd">${sr.allergyDetail||'Yes (no detail given)'}</span></div>`;
    else if(sr.allergies==='No') h+=`<div class="kv"><span class="k">Allergies / meds</span><span class="v">None reported</span></div>`;
    if(sr.ec1name) h+=`<div class="kv"><span class="k">Emergency contact</span><span class="v">${sr.ec1name}${sr.ec1rel?' ('+sr.ec1rel+')':''}${sr.ec1phone?'<br>'+sr.ec1phone:''}</span></div>`;
    if(sr.ec2name) h+=`<div class="kv"><span class="k">Emergency contact 2</span><span class="v">${sr.ec2name}${sr.ec2rel?' ('+sr.ec2rel+')':''}${sr.ec2phone?'<br>'+sr.ec2phone:''}</span></div>`;
    if(sr.parentCount) h+=`<div class="kv"><span class="k">Parent program</span><span class="v">${sr.parentCount} attending</span></div>`;
    const consents=[sr.consentMedical?'Medical':null,sr.consentWaiver?'Waiver':null,sr.consentData?'Data':null].filter(Boolean);
    h+=`<div class="kv"><span class="k">Consent forms</span><span class="v">${consents.length===3?'All signed':consents.length?consents.join(', ')+' only':'Not signed'}${sr.signature?'<br>Signed: '+sr.signature:''}</span></div>`;
  }
  if(diffs.length){
    h+='<div class="regdiff"><div class="rd-h">&#9873; Answered differently at registration</div>'+diffs.map(k=>`<div class="rd-row"><div class="rd-l">${REG_LABELS[k]||k}</div><div class="rd-app">App: <b>${regBase(s,k)||'—'}</b></div><div class="rd-reg">Registration: <b>${re[k]||'—'}</b></div></div>`).join('')+'<div class="rd-note">Both answers kept &mdash; verify with the family. The application was not changed.</div></div>';
  }
  return h+'</div>';
}

function exportRoster(){

  a.href=url; a.download=`Alpha_${cn}_shadow_roster.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);

  const sre=e.target.closest&&e.target.closest("[data-sr]"); if(sre){const s=STUDENTS[state.parentStudent]; s.shadowReg=s.shadowReg||{}; const key=sre.dataset.sr; s.shadowReg[key]=(e.target.type==='checkbox')?e.target.checked:e.target.value; persist(); if(key==='allergies'){openRegister();} else if(key==='signature'){const sig=document.querySelector('.reg-sig'); if(sig)sig.textContent=e.target.value;} return;}
  const sl=e.target.closest&&e.target.closest("[data-deanlink]"); if(sl){const o=sl.dataset.deanlink; if(o===ME){TEAM_LINKS[o]=e.target.value;saveTeamLinks();} return;}
  const mc=e.target.closest&&e.target.closest("[data-mycampus]"); if(mc){const cc=campusById[mc.dataset.mycampus]; if(e.target.checked){cc.owner=ME;} else {cc.owner=(cc.defaultOwner&&cc.defaultOwner!==ME)?cc.defaultOwner:(Object.keys(TEAM).find(k=>k!==ME)||ME);} saveCampusColors(); openAccount(); render(); return;}
  const sf=e.target.closest&&e.target.closest("[data-sf]");
  if(sf){const p=sf.dataset.sf.split(":");STUDENTS[+p[0]][p[1]]=e.target.value;persist();return;}
  const gf=e.target.closest&&e.target.closest("[data-gf]"); if(!gf)return;
  const parts=gf.dataset.gf.split(":"); const s=STUDENTS[+parts[0]];
  if(!s.guide)s.guide={published:false}; s.guide[parts[1]]=e.target.value; persist();
}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();closeCompose();}});
/* drag-to-reorder columns */
let dragCol=null;
document.addEventListener("dragstart",e=>{const th=e.target.closest&&e.target.closest("[data-colkey]");if(th){dragCol=th.dataset.colkey;th.classList.add("dragging");try{e.dataTransfer.effectAllowed="move";}catch(_){}}});
document.addEventListener("dragend",e=>{const th=e.target.closest&&e.target.closest("[data-colkey]");if(th)th.classList.remove("dragging");});
document.addEventListener("dragover",e=>{if(e.target.closest&&e.target.closest("[data-colkey]"))e.preventDefault();});
document.addEventListener("drop",e=>{const th=e.target.closest&&e.target.closest("[data-colkey]");if(!th||!dragCol)return;e.preventDefault();
  const target=th.dataset.colkey; if(target===dragCol){dragCol=null;return;}
  const arr=state.cols.slice(); const from=arr.indexOf(dragCol); if(from<0){dragCol=null;return;}
  arr.splice(from,1); let to=arr.indexOf(target); if(to<0)to=arr.length; arr.splice(to,0,dragCol);
  state.cols=["name",...arr.filter(x=>x!=="name")]; dragCol=null; persistCols(); renderCampusTab();});

render();
</script>
</body>
</html>
